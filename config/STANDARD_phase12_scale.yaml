# Phase 12 - DOES COMPUTE BUY WINS ON A *FIXED* ENVIRONMENT?
#
# "Train it longer" is recorded in CLAUDE.md as a disproven lever: p4 (7M) and
# p5 (30M) both landed at ~16-17%. But that disproof was measured on an
# environment with two defects since found:
#   - stamina wear never reset, so every run trained a body pinned at the wear
#     floor within its first ~1% (and Stamina.Ratio normalises by EffectiveMax,
#     so the observation hid it);
#   - the opponent ray sensor detected the tag "Agent", which BOTH teams carried,
#     so it could not separate friend from foe at all.
#
# A lever disproven on a broken environment deserves exactly one clean retest.
# This is that retest, continued from the p11 pilot rather than restarted, so
# the 3M already spent is not thrown away.
#
# IF THIS ALSO LANDS AT ~17%: stop buying steps. The answer is not compute.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        # 0.995 at 12.5 decisions/s ~= a 16 second effective horizon.
        gamma: 0.995
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 500000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # Uniform over the full range so the policy meets the full-strength bot during
  # training, not only at eval time (carried forward from phase 9).
  bot_strength:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.2
      max_value: 1.0
