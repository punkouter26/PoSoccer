# p36bot / STANDARD - bot-only continuation of the best brain (2026-10-14).
# Continues soccer_p35league_standard (61.1% against bot v1, n=350) for 10M steps against
# the scripted bot on every pitch.
#
# Launch (no -League):
#   .\scripts\train-phase1.ps1 -RunId soccer_p36bot_standard -Config TRAIN_STANDARD_p36bot.yaml `
#       -InitFrom soccer_p35league_standard -EnvPath Builds\PoSoccer\PoSoccer.exe -NumEnvs 4
#
# WHY NOT A THIRD LEAGUE RUN. p34control (p33team + 10M against the bot only) graded 54.9%,
# level with p34league's 52.3% from the same start: the league pool did not earn that gain,
# the extra steps did. Bot-only runs at about 540 s per million against the league's 875,
# so it buys the same steps in about 60% of the time.
#
# Everything below `behaviors:` is TRAIN_STANDARD_p34control.yaml unchanged.
#
# HOW TO READ IT. 350 episodes against bot v1, compared with p35league's 61.1% wins and
# 25.1% stalemates, plus the movement probe. A gain under about 5 points is inside two SD.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  goal_width: 6.0
  # The bot plays at full strength throughout: the brain this
  # starts from finished p33team on the full-strength lesson.
  bot_strength: 1.0

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
