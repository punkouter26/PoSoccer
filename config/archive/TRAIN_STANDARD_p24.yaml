# p24 - POTENTIAL-BASED ball->goal shaping. Config is identical to p23 (3M pilot);
# the change is again in the reward assets and Reward_Settings.cs.
#
# WHY p23 WAS STOPPED AT 600k. Its mean reward sat dead flat between -1.11 and -1.23
# across six consecutive summaries (100k..600k, std ~0.11). That value is almost
# exactly goalConceded (-1.0) plus stepPenalty (~-0.2): the policy was conceding and
# running out the clock every episode, and not moving. p23 is recorded as an
# INCOMPLETE run, not a disproof - but its partial evidence points the same way as
# the arithmetic below, and the arithmetic came first.
#
# WHAT p23 GOT WRONG. Its budget fix reasoned about UNDISCOUNTED episode totals: cap
# every dense term below the largest terminal reward. That is the right property for
# not corrupting the optimal policy, but it ignores how the agent actually learns.
# At gamma 0.99 with decision period 8, one episode is 1125 decisions, so a terminal
# reward valued from the episode start arrives discounted by ~1.2e-5. Terminals only
# bite within ~100 decisions (8 s) of the event. DENSE SHAPING IS THE LEARNING
# SIGNAL, and dividing it by 10 starved it.
#
# THE RIGHT FIX IS THE FORM, NOT THE NUMBER. The old ball->goal term rewarded ball
# VELOCITY toward the net - a rate, so it accumulates without bound (hence the +9.0
# ceiling) and it is farmable: knock the ball goalward, let it roll back, get paid
# twice for no progress. Rewarding the DECREASE IN THE BALL'S DISTANCE to the goal
# instead telescopes to scale * (startDist - endDist) over any trajectory. That is
# potential-based shaping in the Ng/Harada/Russell (1999) sense, which provably
# leaves the optimal policy unchanged AT ANY MAGNITUDE. So it is simultaneously
# unfarmable, bounded by the pitch rather than the step count, and free to carry a
# strong coefficient.
#
# ballToGoalProgressScale = 0.02, deliberately SYMMETRIC with ballProximityScale:
# closing one unit on the ball and moving the ball one unit toward the net pay the
# same. Both telescope to 0.02 * 54 = 1.08, under the 1.2 goal. This is the same
# trick ballProximityScale has always used; the ball->goal half was simply never
# converted.
#
# COMPARABILITY. Table changed again, so mean reward is comparable to NEITHER p22 nor
# p23. Judge on the PROBE and the EVAL WIN RATE. What to watch first: whether mean
# reward climbs off the -1.2 floor at all, which is the single thing p23 never did.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # One flat threshold, applied to every lesson: the policy must be genuinely
  # winning (goalScorer 0.7 vs goalConceded -1.0, so a sustained +0.5 mean means
  # scoring materially more than it concedes) before the opponent gets stronger.
  # min_lesson_length 1000 makes a lucky streak far too expensive to fake.
  bot_strength:
    curriculum:
      - name: Lesson0_Feeble
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.2
      - name: Lesson1_Weak
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.35
      # Support positioning and corner craft switch on at 0.5 - the first real step up.
      - name: Lesson2_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.5
      - name: Lesson3_Capable
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.65
      # The boost-shot switches on at 0.8.
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  # 4 is what every run in this project has ACTUALLY used: scripts/train-phase1.ps1
  # passes --num-envs=4 on the command line, which overrides this key. The file used to
  # say 1, so the configuration.yaml archived with each run disagreed with the run that
  # produced it (p22's record reads num_envs: 4 against a config file reading 1).
  # Corrected so a run launched WITHOUT the script cannot silently drop to a quarter
  # of the throughput while looking identical in the archive.
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
