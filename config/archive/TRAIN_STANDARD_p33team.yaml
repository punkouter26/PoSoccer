# p33team / STANDARD - SHARED GOAL REWARD (2026-10-11). Continues soccer_p32pass_standard.
#
# Launch:
#   .\scripts\train-phase1.ps1 -RunId soccer_p33team_standard -Config TRAIN_STANDARD_p33team.yaml `
#       -InitFrom soccer_p32pass_standard -Squad "1,2,2,2" -EnvPath Builds\PoSoccer\PoSoccer.exe -NumEnvs 4
#
# p32pass lifted 2v2 passes from 11 to 81 per 350 episodes and 2v2 wins from 21.7% to 30.0%,
# then plateaued at about half the scripted bots' pass rate. Reward/pass was about 0.02 per
# episode - too small to steer - and the goal reward paid the scorer 1.2 against 0.3 for the
# assist and 0.2 for any other teammate, so each player was paid to shoot, not to set up.
#
# Two changes against p32pass:
#  1. Reward_STANDARD.asset: assist 0.3 -> 1.0, teamBaselineVictory 0.2 -> 0.8 (goalScorer
#     stays 1.2). REQUIRES A REBUILT PLAYER - these live in the asset, not here. They pay
#     nothing in 1v1, where there is no teammate, so the benchmark's reward table is unchanged.
#  2. pass_reward 0.2 -> 0.3 (episode cap 1.2, equal to a goal).
# Curriculum starts at 0.8: p32pass finished on the full-strength lesson.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  goal_width: 6.0

  # Team shaping. All three are off unless named (Agent_EnvController.ResetPitch).
  team_roles: 1.0
  team_spacing: 0.00005
  # Paid to passer AND receiver for a completed pass (teammate to teammate, 3 m or more,
  # no opponent touch between), scaled by the ground it gains toward goal: full value at
  # 8 m, nothing for a square or backward pass, nothing for ground the possession had
  # already covered. Capped at 4x per side per episode (0.8), under a goal (1.2).
  pass_reward: 0.3

  # Starts at 0.5: below that the scripted bots neither hold a shape nor pass, and this
  # run is warm-started from a brain that already cleared the weaker lessons at 1v1.
  bot_strength:
    curriculum:
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.15
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true

