# p34league / STANDARD - LEAGUE: past selves plus the scripted bot (2026-10-11).
# Continues soccer_p33team_standard. RUN 2026-10-13: 52.3% at n=350 (docs/training-history.md).
#
# Launch (rebuild the player first - the league seating is new code):
#   .\scripts\train-phase1.ps1 -RunId soccer_p34league_standard -Config TRAIN_STANDARD_p34league.yaml `
#       -League -InitFrom soccer_p33team_standard -EnvPath Builds\PoSoccer\PoSoccer.exe -NumEnvs 4
#
# WHAT IS DIFFERENT FROM THE SELF-PLAY RUNS ALREADY ON RECORD. docs/training-history.md
# lists v2, v3 and p3 (accidental symmetric self-play, 15-19% against the bot) and p16b
# (POCA self-play, no ELO tag). All four predate the 2026-08-28 body-frame fix, none had
# the bot in the opponent pool, and none started from a brain that already beats the bot
# more often than it loses. So this is a new experiment, not a repeat - and equally it has
# no result yet. Treat it as untested.
#
# The opponent pool, from -League (POSOCCER_OPPONENT=league), cycles over the pitch grid:
#   self-play, bot as red, self-play, bot as blue
# so half the pitches face a past snapshot of the learner and half face the bot that
# evaluate.ps1 grades against. The bot sits on both colours because the ghost trainer
# alternates which team is learning (team_change); on one colour only, the other colour's
# learning phase would never meet it.
#
# ONE VARIABLE AGAINST p33team: the opponent pool. Same PPO hyperparameters, same reward
# assets, 1v1 pitches only (the benchmark lineup; no -Squad). The team terms are left out
# because they pay nothing at 1v1.
#
# HOW TO READ IT.
#  - PoSoccer/league_bot_pitch must read about 0.5. A flat 0 means the seating never
#    reached the player and the run is plain self-play: stop it.
#  - Self-play/ELO is NOT a clean gate here. The trainer scores every finished episode of
#    the learning team against the current snapshot's rating, including the episodes that
#    were actually played against the bot, and it reads a stalemate (-0.6 to both sides)
#    as a loss. Use it as a liveness signal only.
#  - Mean reward is zero-sum on the self-play pitches. Not a decision variable (CLAUDE.md).
#  - The grade is evaluate.ps1 at 350 episodes against bot v1, compared with p33team's
#    37.1%, plus Agent_PlayMode_MovementProbe. Nothing else.
#
# max_steps counts the learning team's steps only, so the wall-clock per million is higher
# than the 600-1000 s measured on bot-only runs. Nobody has measured by how much.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000
    self_play:
      # A snapshot of the learner joins the pool every 50k steps and the pool holds the
      # last 10, so the oldest opponent is 500k steps behind.
      save_steps: 50000
      window: 10
      # Half the self-play episodes face the current policy, half a pooled snapshot.
      play_against_latest_model_ratio: 0.5
      # The learning team changes every 200k steps and the opponent snapshot is redrawn
      # every 10k, about twenty opponents per learning phase.
      team_change: 200000
      swap_steps: 10000
      initial_elo: 1200.0

environment_parameters:
  goal_width: 6.0
  # The bot on the league's bot pitches plays at full strength throughout: the brain this
  # starts from finished p33team on the full-strength lesson.
  bot_strength: 1.0

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
