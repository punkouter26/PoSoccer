# Phase 3b: identical to STANDARD_phase3_opponent.yaml except for exploration.
#
# Why this variant exists. Three phase-1 runs plateaued at 15-18% wins with
# rising mean reward but no win-rate movement - the signature of a policy that
# has converged onto one mediocre strategy and stopped sampling alternatives.
# Phase 3 fixes the *curriculum* (opponent strength instead of goal width);
# this run tests whether the plateau is additionally an *exploration* failure.
#
# Two changes, both on the entropy bonus, nothing else:
#   beta          5.0e-3 -> 1.5e-2   (3x stronger pull toward high-entropy policies)
#   beta_schedule linear -> constant (linear decay zeroed exploration out by the
#                                     end of the run, exactly when the harder
#                                     curriculum lessons need it most)
#
# Everything below this comment block is byte-identical to phase 3 apart from
# those two lines, so the morning comparison isolates one variable.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 1.5e-2
      beta_schedule: constant
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1024
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
    threaded: false

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  bot_strength:
    curriculum:
      - name: Lesson0_Quarter
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.30
        value: 0.25
      - name: Lesson1_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.20
        value: 0.49
      - name: Lesson2_ThreeQuarter
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.10
        value: 0.75
      - name: Lesson3_Full
        value: 1.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
