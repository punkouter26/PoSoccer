# Phase 3c: PPO self-play, seeded from the phase-3 run earlier the same night.
#
# Why PPO and not POCA. STANDARD_phase2_poca.yaml is the eventual 2v2 config,
# but --initialize-from cannot carry a PPO checkpoint into a POCA trainer: POCA
# adds a centralised critic, so the network shapes do not match and the transfer
# either errors or silently loads nothing. This run keeps trainer_type: ppo and
# hidden_units: 256 so the weights from run A load cleanly, and adds only the
# self_play block. Move to POCA once self-play itself is proven to help.
#
# Why self-play at all. The rule-based bot is deterministic. A policy trained
# only against it can (and by the 15-18% eval numbers, probably does) overfit to
# one opponent's fixed habits rather than learn soccer. Self-play supplies an
# opponent that improves alongside the policy, which is the standard fix for
# exactly the plateau these runs show.
#
# No bot_strength curriculum here: the opponent is a past copy of the policy,
# not the bot, so that parameter has nothing to act on. goal_width stays pinned
# at the evaluation value for the same reason it is pinned in phase 3.
#
# Read the ELO scalar in TensorBoard, not mean reward - self-play rewards are
# zero-sum and hover near zero by construction, so a flat reward curve here is
# expected and is NOT evidence the run failed.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1024
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
    threaded: false
    self_play:
      # Snapshot every 50k steps, keep a window of 10 past selves, and face the
      # newest snapshot half the time (the rest sample the window, which is what
      # stops the policy from chasing one moving target into a cycle).
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
