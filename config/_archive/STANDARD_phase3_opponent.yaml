# Phase 3: curriculum on OPPONENT STRENGTH, not goal width.
#
# Why this config exists. Three phase-1 runs (v2 ~5M, v3 ~15.7M, and the earlier
# 20M) all plateaued at 15-18% wins against the bot - below the 42.5% a mirror
# copy of the bot scores - and all three stayed pinned in goal_width Lesson0.
# Two design faults explain that:
#
#   1. The goal_width curriculum ramped the wrong axis. Lesson0 opened both
#      goals to 18 m on a pitch ~10.8 m across, so the entire back line was a
#      goal at BOTH ends. That does not make scoring easier relative to the
#      opponent - it just converts every possession into a goal, and the bot
#      wins possession more often. Reward therefore never reached the advance
#      threshold and the lesson never changed.
#
#   2. Training ran at goal_width 18.0 while evaluation runs at the scene
#      default of 6.0 (no trainer is attached during eval, so the environment
#      parameter falls back). The policy was graded on a pitch it had never
#      played. goal_width is fixed at 6.0 here so train and eval agree.
#
# The lever that was available all along and never used: Agent_HeuristicBot
# already scales drive, turn authority and boost by 'bot_strength', and below
# 0.5 it also drops the support-positioning and corner-craft logic. Nothing in
# scripts/ or config/ ever set it, so every run to date faced a full-strength
# deterministic opponent from step 0 - against which a random initial policy
# essentially never scores, leaving no positive gradient to bootstrap from.
#
# Hyperparameters are unchanged from TRAIN_STANDARD_v2.yaml so this run isolates
# the curriculum change. Lesson thresholds fall as difficulty rises: beating a
# quarter-strength bot should be easy, beating a full one should not.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1024
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 10
    threaded: false

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  bot_strength:
    curriculum:
      # Half speed, no support positioning, no corner craft, no boost-shot:
      # a chaser the policy can actually out-play while it learns to shoot.
      - name: Lesson0_Quarter
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.30
        value: 0.25
      # Still no support/corner logic (both gate at 0.5), but real pace.
      - name: Lesson1_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.20
        value: 0.49
      # Support positioning and corner craft switch on here - the step change.
      - name: Lesson2_ThreeQuarter
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.10
        value: 0.75
      # Full v1 bot, including the boost-shot (gated at 0.8). This is the
      # opponent evaluate.ps1 grades against.
      - name: Lesson3_Full
        value: 1.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
