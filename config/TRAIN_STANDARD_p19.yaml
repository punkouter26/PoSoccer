# p19 - single variable vs p18 (soccer_p18bf_standard): gamma 0.99 -> 0.999.
#
# p18 (the body-frame fix) trained 12x faster than p17 and crossed positive mean
# reward for the first time, but the probe still reads arrival=-1.00s: the policy
# drives at raw magnitude ~0.32 instead of 1.0, so it never gets to the ball.
#
# Why it will not commit: at gamma 0.99 the effective horizon is 1/(1-0.99) = 100
# DECISIONS. DecisionRequester period is 8 at a 0.01 s fixed timestep, so that is
# ~8 seconds of game time - while scoring takes 10-45 s. The terminal goal reward
# (+1.2) therefore reaches the policy multiplied by ~0.99^560 = 0.004. It is not a
# weak signal, it is an absent one, and everything the policy actually optimises is
# the dense per-step shaping. Gentle drive is the local optimum of that shaping,
# because the proximity term is differential and telescopes to
# 0.02 * (d_start - d_end) - closing slowly pays exactly what closing fast pays.
#
# gamma 0.999 puts the horizon at 1000 decisions = ~80 s, which covers a whole
# episode, so terminal rewards can finally propagate back to the approach.
#
# Chosen over restoring stepPenalty because that is pinned by
# Agent_EditMode_SoccerAgent (v2 zeroed it deliberately - "it washed out the whole
# reward gradient") and would need a code + asset + test change and a player
# rebuild. This is config-only and reversible.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.999
        strength: 1.0
    max_steps: 3000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # One flat threshold, applied to every lesson: the policy must be genuinely
  # winning (goalScorer 0.7 vs goalConceded -1.0, so a sustained +0.5 mean means
  # scoring materially more than it concedes) before the opponent gets stronger.
  # min_lesson_length 1000 makes a lucky streak far too expensive to fake.
  bot_strength:
    curriculum:
      - name: Lesson0_Feeble
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.2
      - name: Lesson1_Weak
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.35
      # Support positioning and corner craft switch on at 0.5 - the first real step up.
      - name: Lesson2_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.5
      - name: Lesson3_Capable
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.65
      # The boost-shot switches on at 0.8.
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
