# KIM personality brain on the p21 recipe - identical to TRAIN_STANDARD_p21.yaml
# apart from the behavior name.
#
# p21 is the first configuration in this project's history to climb the
# bot_strength ladder (Lesson0 -> Lesson1 @5.45M -> Lesson2 @6.6M -> Lesson3 @9.05M)
# and the first to break the 16-17% eval plateau (25.7% over 350 episodes).
# The earlier TRAIN_KIM_v3.yaml is the superseded 3M / threshold-0.50 recipe,
# which never promoted once in three runs - do not use it.
#
# Personality is NOT a hyperparameter. It lives entirely in the reward DNA of
# Assets/Agents/*/Reward_KIM.asset, which the player picks up from POSOCCER_PROFILE.
# KIM: wall     - goalScorer 1.3, goalConceded -1.2, defensivePositionScale 0.0006
#
# Keeping the trainer config byte-identical across all four brains is what makes
# them comparable: any behavioural difference is reward DNA, not tuning.
behaviors:
  KIM:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # One flat threshold, applied to every lesson: the policy must be genuinely
  # winning (goalScorer 0.7 vs goalConceded -1.0, so a sustained +0.5 mean means
  # scoring materially more than it concedes) before the opponent gets stronger.
  # min_lesson_length 1000 makes a lucky streak far too expensive to fake.
  bot_strength:
    curriculum:
      - name: Lesson0_Feeble
        completion_criteria:
          measure: reward
          behavior: KIM
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.2
      - name: Lesson1_Weak
        completion_criteria:
          measure: reward
          behavior: KIM
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.35
      # Support positioning and corner craft switch on at 0.5 - the first real step up.
      - name: Lesson2_Half
        completion_criteria:
          measure: reward
          behavior: KIM
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.5
      - name: Lesson3_Capable
        completion_criteria:
          measure: reward
          behavior: KIM
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.65
      # The boost-shot switches on at 0.8.
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: KIM
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
