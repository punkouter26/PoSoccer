# Phase 2 — MA-POCA self-play for 1v1 up to 3v3 team dynamics.
# Both teams run the "SoccerAgent" behavior with distinct TeamIds (Blue=0, Red=1);
# Agent_EnvController registers SimpleMultiAgentGroups when a side has >1 player.
behaviors:
  SoccerAgent:
    trainer_type: poca
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: constant
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 30000000
    time_horizon: 1000
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 5
    threaded: false
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 2000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0

environment_parameters:
  goal_width:
    curriculum:
      - name: Lesson0_WideNet
        completion_criteria:
          measure: Elo
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1250.0
        value: 6.0
      - name: Lesson1_MidNet
        completion_criteria:
          measure: Elo
          behavior: SoccerAgent
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 1350.0
        value: 4.0
      - name: Lesson2_TightNet
        value: 2.5

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
