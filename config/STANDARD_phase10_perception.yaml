# Phase 10 - SPECIALIZED RAY SENSORS.
#
# Splits the single 11-ray 4-tag Sensor_Vision into one ray sensor per
# object class (Ball / Goal / Opponents / Walls) per the "AI Learns to
# Play Soccer" breakthrough tip. Total model inputs go from 118 to 160
# (66 ray + 52 vec became 108 ray + 52 vec); this obsoletes every .onnx,
# which is fine - none are assigned as of 2026-08-05, so the model input
# shape is reset on the next training run with no stranded assets.
#
# Why this, not another reward/perception tweak:
#   p5 (120 deg sensor)            -> 16.2%
#   p6 (+ opponent vec obs)       -> 17.1%
#   p7 (reward table fix)         -> 16.6%
#   p8 (locomotion drift fix)     -> 16.9%
# Four runs, four hypotheses, one flat result. The remaining gap is the
# "I can see the nearest opponent's position+velocity in vector obs, but
# no opponents anywhere else on the pitch" issue. A dedicated
# Sensor_Opponents ray at 360 deg gives the agent a continuous "opponent
# in that direction" signal without triangulation.
#
# Bot strength is uniform [0.2, 1.0] - carries forward the phase 9 fix;
# we know the train/eval mismatch was a confounding factor in p5/p6/p7.
#
# 3M step pilot per p8 lesson. Run Probe_B_ChaseEfficiency after export.
# If the agent still moves ~1m / 0.6 m/s, do NOT escalate to 20M -
# something else is still wrong and more compute will not find it.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 500000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # Uniform over the full range so the policy meets the full-strength
  # bot during training, not only at eval time. Low end stays in the mix
  # so there is still a learnable gradient early rather than a wall of
  # unwinnable games.
  bot_strength:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.2
      max_value: 1.0