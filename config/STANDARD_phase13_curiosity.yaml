# Phase 13 - EXPLORATION.
#
# Five extrinsic-only runs plateaued fast at 16-17%. Fast convergence to a
# mediocre fixed point is the signature of an exploration failure, not a
# capacity or reward-shaping one - and reward shaping has already been tested
# and rejected (phase 7).
#
# Curiosity strength is deliberately small (0.02). Anything larger and the agent
# optimises novelty over the scoreboard, which on this pitch means loitering
# near walls where contact dynamics are least predictable.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 3.0e-4
        network_settings:
          hidden_units: 128
          num_layers: 2
    max_steps: 8000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 500000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # Uniform over the full range so the policy meets the full-strength bot during
  # training, not only at eval time (carried forward from phase 9).
  bot_strength:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.2
      max_value: 1.0
