# Phase 6: the first run where the policy can actually see its opponent.
#
# Why this run exists. Five runs (5M-30M steps, two sensor geometries) all landed
# at 16-17% wins against the scripted bot, where bot-vs-bot parity is 42.5%. The
# 2026-08-04 measurement pass showed why, and it is not training budget:
#
#   1. CollectObservations carried NO opponent term. The policy's only view of an
#      opponent was the 11-ray sensor, which guarantees detection only within
#      ~1.9 units (0.6% of the 36x54 pitch) and cannot separate friend from foe
#      because every player shares the "Agent" tag. Agent_HeuristicBot reads
#      nearestOpponent exactly, at unlimited range. Fixed: obs 18 -> 26, adding
#      two nearest-opponent slots (rel position + velocity, zero-padded).
#
#   2. ballContact paid 0.05 per touch against 0.7 for a goal, so 14 pokes beat
#      scoring over a ~4400-step episode. Fixed: 0.005.
#
#   3. The phase-5 threshold ladder still FELL as difficulty rose (0.40 -> 0.25)
#      despite its own header claiming otherwise, so p5 reached the top lesson
#      while its reward oscillated between -1.07 and +0.52. Fixed below: one flat
#      mastery threshold and a 5x longer minimum lesson.
#
# Every .onnx from before 2026-08-04 expects 18 observations and cannot be used
# with this config. -InitFrom will not work across the contract change; this is a
# from-scratch run.
#
# Measurement note: a single 100-episode eval has a ~3.7-point standard deviation,
# so 16% and 24% are the same result. Grade this run with -Episodes 1000.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 500000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # One flat threshold, applied to every lesson: the policy must be genuinely
  # winning (goalScorer 0.7 vs goalConceded -1.0, so a sustained +0.5 mean means
  # scoring materially more than it concedes) before the opponent gets stronger.
  # min_lesson_length 1000 makes a lucky streak far too expensive to fake.
  bot_strength:
    curriculum:
      - name: Lesson0_Feeble
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.2
      - name: Lesson1_Weak
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.35
      # Support positioning and corner craft switch on at 0.5 - the first real step up.
      - name: Lesson2_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.5
      - name: Lesson3_Capable
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.65
      # The boost-shot switches on at 0.8.
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
