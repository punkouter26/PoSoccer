# p37bot / STANDARD - bot-only, second 10M on the bot-only line (2026-10-14).
# Continues soccer_p36bot_standard: 81.1% wins, 12.7% stalemates against bot v1 at n=1000.
# The win bar (80%) is met; the stalemate bar (10%) is not.
#
# Launch:
#   .\scripts\train-phase1.ps1 -RunId soccer_p37bot_standard -Config TRAIN_STANDARD_p37bot.yaml `
#       -InitFrom soccer_p36bot_standard -EnvPath Builds\PoSoccer\PoSoccer.exe -NumEnvs 4
#
# ONE VARIABLE AGAINST p36bot: the starting brain. Everything below `behaviors:` is
# TRAIN_STANDARD_p34control.yaml unchanged.
#
# WHY. p36bot cut stalemates from 25.1% to 12.7% and lifted wins from 61.1% to 81.1% in one
# 10M bot-only run. This asks whether another 10M closes the last 2.7 points of stalemates.
#
# HOW TO READ IT. Grade at n=1000 (the stalemate margin is near 1 SD at n=350), against
# p36bot's 81.1% / 12.7%, plus the movement probe.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  goal_width: 6.0
  # The bot plays at full strength throughout: the brain this
  # starts from finished p33team on the full-strength lesson.
  bot_strength: 1.0

env_settings:
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
