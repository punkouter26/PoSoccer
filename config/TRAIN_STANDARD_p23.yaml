# p23 - the REWARD BUDGET lever. SINGLE VARIABLE vs p22: this file is identical to
# TRAIN_STANDARD_p22.yaml below the header except max_steps (10M -> 3M, pilot). The
# only real change is in the reward ASSETS and Reward_Settings.cs defaults.
#
# WHY. Nobody had ever computed what a dense term accumulates over a whole episode.
# They are written as small numbers and read as negligible next to a 1.2 goal, but
# they are charged EVERY PHYSICS STEP against a 9000-step cap (measured 2026-09-07):
#
#   term                      old      per-episode ceiling   vs terminal
#   ballToGoalVelocityScale   0.001    +9.0                  7.5x a goal (+1.2)
#   cornerBallPenalty         0.0006   -5.4                  5.4x conceding (-1.0)
#   wallProximityPenalty      0.0005   -4.5                  4.5x conceding
#   crossbarProximity         0.0005   +4.5                  3.75x a goal
#   possessionScale (NICK)    0.0006   +5.4                  4.5x a goal
#   defensivePositionScale(KIM) 0.0006 +5.4                  4.2x KIM's goal (1.3)
#
# A policy maximising return under that table should farm ball-goal velocity and
# avoid corners, NOT score and defend. That is a more direct account of this
# project's signature "learns not to lose, never learns to win" plateau than the
# curriculum story it was attributed to. Note these are MAXIMA - real duty cycles
# are lower - but the ceiling being reachable at all means the table does not
# guarantee the ordering of outcomes.
#
# The method is not new here: stepPenalty's own comment does exactly this budget
# arithmetic ("9000 steps, -0.9, near-identical to goalConceded"). It had simply
# never been applied to the other seven terms.
#
# THE CHANGE. Every per-step term divided by 10 (trait RATIOS between personalities
# preserved, so the characters stay recognisable); facingAlignmentScale and
# crossbarProximity retired outright as redundant - bearing to the ball has been an
# OBSERVATION since the 2026-08-28 body-frame fix, and a ball in the goal mouth
# moving netward is already paid by ballToGoalVelocityScale and then by goalScorer.
# Agent_EditMode_RewardBudget now fails if any term regains a ceiling above the
# largest terminal reward.
#
# COMPARABILITY - READ THIS BEFORE JUDGING THE RUN. The reward table CHANGED, so
# mean reward is NOT comparable to p22, exactly as the p18->p20 stepPenalty step
# was not. Judge on the PROBE (arrival time, distance, headingChurn) and the EVAL
# WIN RATE, both defined independently of the table.
#
# EXPECT MEAN REWARD TO FALL, AND WATCH THE CURRICULUM. The dense terms that shrank
# were mostly POSITIVE, so episode return drops by construction. The promotion
# threshold 0.21 was calibrated against the OLD table (0.50 minus p20's 0.289
# stepPenalty offset) and is deliberately left UNCHANGED here to keep this a single
# variable. If this pilot stalls on Lesson0_Feeble - where p17, p18 and p20 all died
# - the threshold is the thing to recalibrate next, NOT the budget fix.
#
# GATE (pilot-then-gate, per CLAUDE.md): export, run Agent_PlayMode_MovementProbe,
# and only commit to a 10M run if the agent reaches the ball or clearly improves
# headingChurn against p22.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 3000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # One flat threshold, applied to every lesson: the policy must be genuinely
  # winning (goalScorer 0.7 vs goalConceded -1.0, so a sustained +0.5 mean means
  # scoring materially more than it concedes) before the opponent gets stronger.
  # min_lesson_length 1000 makes a lucky streak far too expensive to fake.
  bot_strength:
    curriculum:
      - name: Lesson0_Feeble
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.2
      - name: Lesson1_Weak
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.35
      # Support positioning and corner craft switch on at 0.5 - the first real step up.
      - name: Lesson2_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.5
      - name: Lesson3_Capable
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.65
      # The boost-shot switches on at 0.8.
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.21
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  # 4 is what every run in this project has ACTUALLY used: scripts/train-phase1.ps1
  # passes --num-envs=4 on the command line, which overrides this key. The file used to
  # say 1, so the configuration.yaml archived with each run disagreed with the run that
  # produced it (p22's record reads num_envs: 4 against a config file reading 1).
  # Corrected so a run launched WITHOUT the script cannot silently drop to a quarter
  # of the throughput while looking identical in the archive.
  num_envs: 4

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
