# Phase 11 DIAGNOSTIC - 300k steps (~3 min). Not a training run: an instrument.
#
# Purpose: measure own_goal_rate BEFORE any reward change, so the fix can be
# proven rather than assumed. Three previous phases committed hours of compute to
# a hypothesis that was never tested first; this is the cheap discriminating run.
#
# Reads (TensorBoard, PoSoccer/*):
#   own_goal_rate        share of goals whose last toucher played for the CONCEDING
#                        side - i.e. goals the policy was paid for without earning
#   untouched_goal_rate  goals with no toucher at all
#   goal_speed_bonus     the bonus actually paid per goal. goalSpeedBonus 0.05 x
#                        secsLeft on a 9000-step episode pays up to 4.5, which is
#                        3.75x goalScorer (1.2) and is paid to NON-touchers too.
#                        The source comment claims 60% remaining adds 0.015; the
#                        real figure is 2.700, a 180x overshoot.
#   blue_mean_speed      blue is the trained side; the probe measures 0.84 m/s
#                        against the bot's 5.21 m/s
#   blue_distance_m      per-episode path length
#
# Everything else is identical to phase 8 so the comparison stays single-variable.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 300000
    time_horizon: 1024
    summary_freq: 10000
    keep_checkpoints: 20
    checkpoint_interval: 300000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # One flat threshold, applied to every lesson: the policy must be genuinely
  # winning (goalScorer 0.7 vs goalConceded -1.0, so a sustained +0.5 mean means
  # scoring materially more than it concedes) before the opponent gets stronger.
  # min_lesson_length 1000 makes a lucky streak far too expensive to fake.
  bot_strength:
    curriculum:
      - name: Lesson0_Feeble
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.2
      - name: Lesson1_Weak
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.35
      # Support positioning and corner craft switch on at 0.5 - the first real step up.
      - name: Lesson2_Half
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.5
      - name: Lesson3_Capable
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.65
      # The boost-shot switches on at 0.8.
      - name: Lesson4_Strong
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 1000
          threshold: 0.50
        value: 0.8
      - name: Lesson5_Full
        value: 1.0

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
