# Phase 9 - RANDOMIZED opponent strength. Kills the train/test mismatch.
#
# Four runs, four hypotheses, one flat result (1000-episode evals):
#   p5 18-obs                    16.2%
#   p6 +opponent observations    17.1%
#   p7 +reward table fixed       16.6%
#   p8 +locomotion drift fixed   16.9%
#
# p8 is the sharpest lesson: fixing the drifted ballProximityScale/actionJitterScale
# made TRAINING look transformed - 8x sample efficiency, the first honest curriculum
# promotion any run has earned, reward +0.648 where p7 ended +0.281 - and moved the
# graded result by nothing. Training reward is not the objective; the eval is.
#
# What has never been tested: the policy meeting a full-strength bot AT ALL.
# The ladder gates promotion on mastery, so a weak policy is trapped on the easiest
# lesson - p7 spent all 20M steps at bot_strength 0.2 and was then graded at 1.0.
# That mismatch is mine: the flat 0.50 gate fixed p5's graduate-on-noise problem and
# created a starvation problem in its place. Coverage went BACKWARDS across runs:
#   p5 -> 0.8 (sloppy falling ladder)   p6 -> 0.5   p7 -> 0.2   p8 -> 0.35
#
# So stop gating. Sample bot_strength uniformly every episode: the policy sees the
# whole difficulty range including 1.0 from step one, the train and eval
# distributions finally match, and there is no threshold left to tune wrong.
# Standard domain randomization - this project already randomizes spawns and ball
# drag the same way.
#
# Everything else is identical to phase 8, so this stays a single-variable test.
# Phase 8 PILOT - 3M steps, not 20M. Verifies the agent can MOVE before spending 3 hours.
#
# Phases 6 and 7 both graded ~17% and neither hypothesis (perception, reward balance)
# explained it. The chase probe finally measured the policy directly:
#
#                        trained policy    scripted bot    chassis
#   distance in 4 s        2.62 m            15.08 m       -
#   reached the ball       never             2.70 s        -
#   top speed              0.95 m/s          5.17 m/s      9.54 m/s
#   heading churn          199 deg           79 deg        -
#
# It never learned to drive. It creeps and spins. Cause: the Reward_*.asset profiles had
# drifted from the code defaults on the locomotion terms - ballProximityScale 0.0004 vs
# 0.002 (5x too weak) and actionJitterScale 0.001 vs 0.0004 (2.5x too strong), a 12x swing
# against moving, 50x on KIM. Editing a field initializer never touches an existing
# ScriptableObject, so the documented v2 fix landed in code and reached no asset.
# Standing still was the local optimum and 20M steps found it.
#
# Fixed in all five profiles; RewardProfiles_MatchCodeDefaultsOnMechanics now pins it.
#
# GATE: export at 3M, run Probe_B_ChaseEfficiency. If the agent does not reach the ball,
# do NOT start a full run - the reward table is still wrong. Everything else is identical
# to phase 7 so the comparison stays single-variable.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 8.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 20000000
    time_horizon: 1024
    summary_freq: 50000
    keep_checkpoints: 20
    checkpoint_interval: 1000000

environment_parameters:
  # Fixed at the evaluation value - no train/eval mismatch.
  goal_width: 6.0

  # Uniform over the full range. 1.0 is what evaluate.ps1 uses, so roughly a fifth
  # of episodes are now played against exactly the opponent being graded, instead of
  # zero. The low end stays in the mix so there is still a learnable gradient early
  # rather than a wall of unwinnable games.
  bot_strength:
    sampler_type: uniform
    sampler_parameters:
      min_value: 0.2
      max_value: 1.0
