# Phase 1b — PPO + imitation boost (BC + GAIL) vs the rule-based bot.
# Demos: Assets/Demos/human_soccer.demo (human keyboard play, Blue side).
# BC strong-but-decaying steers early exploration; GAIL stays weak so the
# extrinsic game reward (strength 1.0) remains the true objective.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.05
        demo_path: c:/Users/punko/Downloads/PoSoccer/Assets/Demos/human_soccer.demo
        network_settings:
          hidden_units: 128
          num_layers: 2
        learning_rate: 3.0e-4
        use_actions: true
    behavioral_cloning:
      demo_path: c:/Users/punko/Downloads/PoSoccer/Assets/Demos/human_soccer.demo
      strength: 0.4
      steps: 1000000
    max_steps: 10000000
    time_horizon: 512
    summary_freq: 20000
    checkpoint_interval: 250000
    keep_checkpoints: 5
    threaded: false

# Curriculum unchanged: goal width 6.0 -> 4.0 -> 2.5 as mean reward rises.
environment_parameters:
  goal_width:
    curriculum:
      - name: Lesson0_WideNet
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.35
        value: 6.0
      - name: Lesson1_MidNet
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.55
        value: 4.0
      - name: Lesson2_TightNet
        value: 2.5

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
