# Phase 1c — pure RL retry with the ball-to-goal velocity shaping reward and a
# longer budget, warm-started from soccer_p1_00 via --initialize-from.
behaviors:
  STANDARD:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 10000000
    time_horizon: 512
    summary_freq: 20000
    checkpoint_interval: 250000
    keep_checkpoints: 5
    threaded: false

environment_parameters:
  goal_width:
    curriculum:
      - name: Lesson0_WideNet
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.35
        value: 6.0
      - name: Lesson1_MidNet
        completion_criteria:
          measure: reward
          behavior: STANDARD
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 0.55
        value: 4.0
      - name: Lesson2_TightNet
        value: 2.5

env_settings:
  num_envs: 1

engine_settings:
  time_scale: 20
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true
